<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Pankaj Pandey, QA Engineer: API and AI-assisted testing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5fd0"/>
      <stop offset="0.55" stop-color="#5b3df5"/>
      <stop offset="1" stop-color="#9b30e8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  <rect width="800" height="300" rx="20" fill="url(#dots)"/>
  <circle cx="720" cy="40" r="140" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="650" cy="310" r="100" fill="#ffffff" fill-opacity="0.06"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="52" y="122" font-size="72" font-weight="800" letter-spacing="-1.5">Pankaj Pandey</text>
    <text x="54" y="178" font-size="32" font-weight="600" fill-opacity="0.95">QA Engineer · API &amp; AI-Assisted Testing</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#ffffff">
    <rect x="52" y="210" width="430" height="44" rx="22" fill="#ffffff" fill-opacity="0.16"/>
    <text x="267" y="239" text-anchor="middle" fill-opacity="0.97">Python · Java · pytest · Claude</text>
  </g>
